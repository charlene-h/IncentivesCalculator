<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Research Incentive Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0f0e0c; --surface:#1a1916; --surface2:#232220; --surface3:#2e2c29;
    --border:#3a3835; --accent:#e8c97a; --accent-dim:#c4a84f;
    --accent-glow:rgba(232,201,122,0.10); --text:#f0ede6; --text-2:#a09a8e;
    --text-3:#5a5550; --green:#6fcf8a; --red:#e8756a; --r:8px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--text); font-family:'Syne',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px 16px;
  }
  .card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; width:100%; max-width:480px; overflow:hidden;
  }
  .card-header {
    padding:18px 22px 14px; border-bottom:1px solid var(--border);
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .card-title { font-size:14px; font-weight:700; letter-spacing:0.04em; }
  .card-sub { font-family:'DM Mono',monospace; font-size:10px; color:var(--text-3); letter-spacing:0.06em; }
  .result-block {
    padding:22px 22px 18px; text-align:center;
    border-bottom:1px solid var(--border); background:var(--accent-glow);
  }
  .result-eyebrow {
    font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--text-3); margin-bottom:6px;
  }
  .result-num {
    font-family:'DM Mono',monospace; font-size:48px; font-weight:500;
    color:var(--accent); letter-spacing:-0.02em; line-height:1;
    transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }
  .result-usd {
    font-family:'DM Mono',monospace; font-size:11px; color:var(--text-3);
    font-weight:300; margin-top:5px; letter-spacing:0.04em; min-height:16px;
  }
  .fairness {
    display:inline-flex; align-items:center; gap:5px; margin-top:10px;
    padding:4px 10px; border-radius:100px; font-family:'DM Mono',monospace;
    font-size:9px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; transition:all 0.2s;
  }
  .fairness.ok  { background:rgba(111,207,138,0.08); color:var(--green); border:1px solid rgba(111,207,138,0.18); }
  .fairness.low { background:rgba(232,117,106,0.08); color:var(--red);   border:1px solid rgba(232,117,106,0.18); }
  .fairness.high{ background:rgba(240,160,80,0.08);  color:#f0a050;      border:1px solid rgba(240,160,80,0.18);  }
  .fairness-dot { width:5px; height:5px; border-radius:50%; background:currentColor; }
  .form-body { padding:18px 22px; display:flex; flex-direction:column; gap:14px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field.full { grid-column:1/-1; }
  label { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-3); }
  input[type="number"], select {
    background:var(--surface2); border:1px solid var(--border); border-radius:var(--r);
    color:var(--text); font-family:'DM Mono',monospace; font-size:13px; font-weight:500;
    padding:9px 12px; width:100%; outline:none; transition:border-color 0.15s;
    -webkit-appearance:none; appearance:none;
  }
  input[type="number"]:focus, select:focus { border-color:var(--accent-dim); }
  select {
    background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%235a5550' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 12px center; padding-right:32px; cursor:pointer;
  }
  select option { background:var(--surface2); }
  .seg { display:flex; border:1px solid var(--border); border-radius:var(--r); overflow:hidden; }
  .seg-btn {
    flex:1; padding:8px 4px; background:var(--surface2); border:none;
    border-right:1px solid var(--border); color:var(--text-3);
    font-family:'DM Mono',monospace; font-size:10px; font-weight:500;
    cursor:pointer; transition:all 0.12s; letter-spacing:0.02em; text-align:center;
  }
  .seg-btn:last-child { border-right:none; }
  .seg-btn.active { background:var(--accent-glow); color:var(--accent); }
  .seg-btn:hover:not(.active) { color:var(--text-2); background:var(--surface3); }
  input[type="range"] {
    flex:1; -webkit-appearance:none; height:3px;
    background:var(--border); border-radius:2px; outline:none; cursor:pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--accent); border:2px solid var(--bg); box-shadow:0 0 0 1px var(--accent-dim); cursor:pointer;
  }
  .slider-row { display:flex; align-items:center; gap:10px; }
  .slider-val { font-family:'DM Mono',monospace; font-size:12px; font-weight:500; color:var(--accent); min-width:16px; text-align:center; }
  .slider-hints { display:flex; justify-content:space-between; margin-top:3px; }
  .slider-hints span { font-family:'DM Mono',monospace; font-size:9px; color:var(--text-3); }
  .divider { border:none; border-top:1px solid var(--border); margin:2px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <span class="card-title">Incentive Calculator</span>
    <span class="card-sub">UX Research Ops</span>
  </div>
  <div class="result-block">
    <div class="result-eyebrow">Recommended Incentive</div>
    <div class="result-num" id="resultNum">—</div>
    <div class="result-usd" id="resultUSD"></div>
    <div class="fairness ok" id="fairness">
      <span class="fairness-dot"></span>
      <span id="fairnessText">Fair Rate</span>
    </div>
  </div>
  <div class="form-body">
    <div class="row">
      <div class="field">
        <label>Duration (min)</label>
        <input type="number" id="duration" value="60" min="5" max="480" oninput="calc()"/>
      </div>
      <div class="field">
        <label>Study Format</label>
        <select id="studyType" onchange="calc()">
          <option value="interview">In-depth Interview</option>
          <option value="usability">Usability Test</option>
          <option value="concept">Concept Testing</option>
          <option value="uat">UAT</option>
          <option value="payment">Local Payment Recording</option>
        </select>
      </div>
    </div>
    <div class="field full">
      <label>Country</label>
      <select id="country" onchange="calc()"></select>
    </div>
    <hr class="divider"/>
    <div class="field full">
      <label>Session Type</label>
      <div class="seg">
        <button class="seg-btn active" id="fmt_remote" onclick="setFmt('remote')">Remote</button>
        <button class="seg-btn" id="fmt_inperson" onclick="setFmt('inperson')">In-Person</button>
      </div>
    </div>
    <div class="field full">
      <label>Task Complexity</label>
      <div class="slider-row">
        <input type="range" id="complexity" min="1" max="5" value="2" oninput="syncSlider();calc()"/>
        <span class="slider-val" id="complexity_val">2</span>
      </div>
      <div class="slider-hints"><span>Simple</span><span>Moderate</span><span>Expert</span></div>
    </div>
    <div class="field full">
      <label>Recruitment Difficulty</label>
      <div class="seg">
        <button class="seg-btn active" id="recr_general"  onclick="setRecr('general')">General</button>
        <button class="seg-btn"        id="recr_targeted" onclick="setRecr('targeted')">Targeted</button>
        <button class="seg-btn"        id="recr_niche"    onclick="setRecr('niche')">Niche</button>
        <button class="seg-btn"        id="recr_rare"     onclick="setRecr('rare')">Rare</button>
      </div>
    </div>
  </div>
</div>
<script>
const COUNTRIES = {
  sg:{label:'🇸🇬 Singapore',   sym:'S$',  remote:50,     inPerson:60,     cur:'SGD',usd:0.74},
  th:{label:'🇹🇭 Thailand',    sym:'฿',   remote:1000,   inPerson:1200,   cur:'THB',usd:0.028},
  my:{label:'🇲🇾 Malaysia',    sym:'RM',  remote:150,    inPerson:180,    cur:'MYR',usd:0.22},
  ph:{label:'🇵🇭 Philippines', sym:'₱',   remote:1000,   inPerson:1200,   cur:'PHP',usd:0.017},
  id:{label:'🇮🇩 Indonesia',   sym:'Rp',  remote:450000, inPerson:500000, cur:'IDR',usd:0.000062},
  vn:{label:'🇻🇳 Vietnam',     sym:'₫',   remote:500000, inPerson:550000, cur:'VND',usd:0.000039},
  gb:{label:'🇬🇧 UK',          sym:'£',   remote:60,     inPerson:70,     cur:'GBP',usd:1.27},
  us:{label:'🇺🇸 US',          sym:'$',   remote:50,     inPerson:55,     cur:'USD',usd:1.00},
  au:{label:'🇦🇺 Australia',   sym:'A$',  remote:65,     inPerson:75,     cur:'AUD',usd:0.64},
  jp:{label:'🇯🇵 Japan',       sym:'¥',   remote:5000,   inPerson:5500,   cur:'JPY',usd:0.0065},
  kr:{label:'🇰🇷 Korea',       sym:'₩',   remote:50000,  inPerson:55000,  cur:'KRW',usd:0.00072},
  de:{label:'🇩🇪 Germany',     sym:'€',   remote:50,     inPerson:55,     cur:'EUR',usd:1.08},
  fr:{label:'🇫🇷 France',      sym:'€',   remote:50,     inPerson:55,     cur:'EUR',usd:1.08},
  ae:{label:'🇦🇪 Dubai',       sym:'AED', remote:150,    inPerson:160,    cur:'AED',usd:0.27},
  sa:{label:'🇸🇦 Saudi Arabia',sym:'SAR', remote:150,    inPerson:200,    cur:'SAR',usd:0.27},
  mx:{label:'🇲🇽 Mexico',      sym:'MX$', remote:800,    inPerson:1000,   cur:'MXN',usd:0.050},
  br:{label:'🇧🇷 Brazil',      sym:'R$',  remote:200,    inPerson:220,    cur:'BRL',usd:0.18},
};
const COMPLEXITY_M={1:1.00,2:1.10,3:1.25,4:1.50,5:2.00};
const RECR_M={general:1.00,targeted:1.15,niche:1.40,rare:2.00};
const BIG=['IDR','VND','KRW','JPY','THB','PHP','MXN','BRL','SAR','AED'];
let state={fmt:'remote',recr:'general'};

window.addEventListener('DOMContentLoaded',()=>{
  const sel=document.getElementById('country');
  Object.entries(COUNTRIES).forEach(([k,v])=>{
    const o=document.createElement('option');
    o.value=k; o.textContent=v.label;
    if(k==='sg') o.selected=true;
    sel.appendChild(o);
  });
  calc();
});

function setFmt(v){
  state.fmt=v;
  ['remote','inperson'].forEach(x=>document.getElementById('fmt_'+x).classList.toggle('active',x===v));
  calc();
}
function setRecr(v){
  state.recr=v;
  ['general','targeted','niche','rare'].forEach(x=>document.getElementById('recr_'+x).classList.toggle('active',x===v));
  calc();
}
function syncSlider(){
  document.getElementById('complexity_val').textContent=document.getElementById('complexity').value;
}
function fmtNum(n,c){
  if(BIG.includes(c.cur)){const r=Math.round(n);return r>=1000?c.sym+(r/1000).toFixed(0)+'K':c.sym+r;}
  return c.sym+Math.round(n);
}
function calc(){
  const dur=parseFloat(document.getElementById('duration').value)||60;
  const ck=document.getElementById('country').value;
  const cx=parseInt(document.getElementById('complexity').value);
  const c=COUNTRIES[ck];
  const base=state.fmt==='inperson'?c.inPerson:c.remote;
  const rec=(dur/60)*base*COMPLEXITY_M[cx]*RECR_M[state.recr];
  document.getElementById('resultNum').textContent=fmtNum(rec,c);
  const uEl=document.getElementById('resultUSD');
  uEl.textContent=c.cur==='USD'?'':'≈ $'+Math.round(rec*c.usd)+' USD';
  const floor=base*(dur/60)*0.5, ceil=base*(dur/60)*6;
  let f='ok',m='Fair Rate';
  if(rec<floor){f='low';m='May be underpaying';}
  if(rec>ceil) {f='high';m='Consider reviewing';}
  document.getElementById('fairness').className='fairness '+f;
  document.getElementById('fairnessText').textContent=m;
}
</script>
</body>
</html>
